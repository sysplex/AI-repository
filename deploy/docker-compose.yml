# M0-T08 全栈编排：api / worker / postgres / redis / nginx + 一次性 migrate。
# 唯一对宿主暴露端口的是 nginx；postgres / redis 只在内部网络可达。
# 用法：cp deploy/env.example deploy/.env && docker compose -f deploy/docker-compose.yml up -d --build

name: stockpilot

x-app-build: &app-build
  image: stockpilot-app:local
  build:
    context: ..
    dockerfile: deploy/Dockerfile

x-app-common: &app-common
  <<: *app-build
  env_file:
    - .env
  environment:
    # compose 内网地址由服务名决定，覆盖 .env 中的宿主视角写法，避免两处漂移。
    DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-stockpilot}:${POSTGRES_PASSWORD:?请在 deploy/.env 设置 POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-stockpilot}
    REDIS_URL: redis://redis:6379/0
  restart: unless-stopped
  networks:
    - backend

services:
  postgres:
    image: postgres:16
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-stockpilot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?请在 deploy/.env 设置 POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-stockpilot}
      # 容器与会话统一 UTC，避免 timestamptz 以外的 log 时间漂移。
      TZ: UTC
      PGTZ: UTC
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-stockpilot} -d ${POSTGRES_DB:-stockpilot}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - backend

  redis:
    image: redis:7
    command: ["redis-server", "--appendonly", "yes", "--save", "60", "1"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 5s
    networks:
      - backend

  migrate:
    <<: *app-common
    command: ["alembic", "upgrade", "head"]
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      # 一次性服务不需要健康检查，避免 compose ps 里出现无意义的 unhealthy。
      disable: true

  api:
    <<: *app-common
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    expose:
      - "8000"

  worker:
    <<: *app-common
    command: ["arq", "app.worker.WorkerSettings"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      # worker 没有 HTTP 端口，镜像自带的 /healthz 探针不适用。
      test: ["CMD", "python", "-c", "import sys; sys.exit(0)"]
      interval: 30s
      timeout: 3s
      retries: 3

  nginx:
    image: nginx:1.27-alpine
    depends_on:
      api:
        condition: service_started
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/index.html:/usr/share/nginx/html/index.html:ro
    ports:
      - "${NGINX_PORT:-8080}:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/healthz >/dev/null || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    networks:
      - backend

volumes:
  pgdata:
  redisdata:

networks:
  backend:
    driver: bridge
