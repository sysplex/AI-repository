# M0-T08 Nginx 反向代理（HTTP / 本地与内网）
# 挂载点：/etc/nginx/conf.d/default.conf（已被 nginx.conf 的 http 块 include）
# 生产 HTTPS 见文件末尾注释段。

upstream stockpilot_api {
    server api:8000;
    keepalive 32;
}

# X-Request-ID 透传：客户端带了就沿用，没带则由 nginx 生成（$request_id 为内置变量）。
map $http_x_request_id $stockpilot_request_id {
    default $http_x_request_id;
    ""      $request_id;
}

server {
    listen 80;
    server_name _;

    server_tokens off;
    client_max_body_size 2m;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css application/json application/javascript
               application/xml text/xml image/svg+xml;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;
    add_header X-Request-ID $stockpilot_request_id always;

    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-ID $stockpilot_request_id;
    # 上游也会回写 X-Request-ID；先隐藏再由下面的 add_header 统一输出一条，
    # 否则响应里会出现大小写不同的两个同名头。
    proxy_hide_header X-Request-ID;
    proxy_connect_timeout 5s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;

    # ---- 探针 ----
    location = /healthz {
        proxy_pass http://stockpilot_api;
    }

    location = /readyz {
        proxy_pass http://stockpilot_api;
    }

    # ---- 业务 API ----
    location /api/ {
        proxy_pass http://stockpilot_api;
    }

    # ---- 文档（M0 供联调；production 由 DOCS_ENABLED=false 在应用侧关闭）----
    location /docs {
        proxy_pass http://stockpilot_api;
    }

    location = /openapi.json {
        proxy_pass http://stockpilot_api;
    }

    # ---- 指标：仅回环与内网管理网段 ----
    # 注意：不要放行 172.16.0.0/12。docker-proxy 会把宿主访问的源地址 NAT 成网桥网关
    # （172.x），一旦放行就等于对公网开放。真正的 Prometheus 应部署在 10.0.0.0/8
    # 管理网，或在同网桥内以 sidecar 直接抓 api:8000/metrics。
    location = /metrics {
        allow 127.0.0.1;
        allow 10.0.0.0/8;
        deny all;
        proxy_pass http://stockpilot_api;
    }

    # ---- 前端占位页（M9 接入真实前端，替换此 root）----
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }
}

