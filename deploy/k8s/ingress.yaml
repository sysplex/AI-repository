apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: stockpilot-ingress
  namespace: stockpilot
  labels:
    app.kubernetes.io/name: stockpilot
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web,websecure
spec:
  ingressClassName: traefik
  rules:
    # 规则 1：域名精准匹配 (stockpilot.vm.ok)
    - host: stockpilot.vm.ok
      http:
        paths:
          # 后端 REST API 接口
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: stockpilot-api
                port:
                  number: 8000
          # Swagger 交互文档与 OpenAPI 规范
          - path: /docs
            pathType: Prefix
            backend:
              service:
                name: stockpilot-api
                port:
                  number: 8000
          - path: /openapi.json
            pathType: Prefix
            backend:
              service:
                name: stockpilot-api
                port:
                  number: 8000
          # 前端 Web UI 应用（主页面、静态资源与前端路由）
          - path: /
            pathType: Prefix
            backend:
              service:
                name: stockpilot-web
                port:
                  number: 8080

    # 规则 2：全局通配兜底（省略 host，RFC 1123 规范，完美支持所有节点 IP 直连）
    - http:
        paths:
          # 后端 REST API 接口
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: stockpilot-api
                port:
                  number: 8000
          # Swagger 交互文档与 OpenAPI 规范
          - path: /docs
            pathType: Prefix
            backend:
              service:
                name: stockpilot-api
                port:
                  number: 8000
          - path: /openapi.json
            pathType: Prefix
            backend:
              service:
                name: stockpilot-api
                port:
                  number: 8000
          # 前端 Web UI 应用（主页面、静态资源与前端路由）
          - path: /
            pathType: Prefix
            backend:
              service:
                name: stockpilot-web
                port:
                  number: 8080
