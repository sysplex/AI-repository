apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: stockpilot-ingress
  namespace: stockpilot
  labels:
    app.kubernetes.io/name: stockpilot
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web,websecure
spec:
  ingressClassName: traefik
  rules:
    # 1. 域名访问 (stockpilot.vm.ok)
    - host: stockpilot.vm.ok
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: stockpilot-api
                port:
                  number: 8000
          - path: /docs
            pathType: Prefix
            backend:
              service:
                name: stockpilot-api
                port:
                  number: 8000
          - path: /openapi.json
            pathType: Prefix
            backend:
              service:
                name: stockpilot-api
                port:
                  number: 8000
          - path: /
            pathType: Prefix
            backend:
              service:
                name: stockpilot-web
                port:
                  number: 8080

    # 2. 节点 IP 显式匹配 (192.168.50.37)
    - host: "192.168.50.37"
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: stockpilot-api
                port:
                  number: 8000
          - path: /docs
            pathType: Prefix
            backend:
              service:
                name: stockpilot-api
                port:
                  number: 8000
          - path: /openapi.json
            pathType: Prefix
            backend:
              service:
                name: stockpilot-api
                port:
                  number: 8000
          - path: /
            pathType: Prefix
            backend:
              service:
                name: stockpilot-web
                port:
                  number: 8080

    # 3. 其余集群节点 IP (192.168.50.36 Master / 38 / 39)
    - host: "192.168.50.36"
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: stockpilot-api
                port:
                  number: 8000
          - path: /docs
            pathType: Prefix
            backend:
              service:
                name: stockpilot-api
                port:
                  number: 8000
          - path: /openapi.json
            pathType: Prefix
            backend:
              service:
                name: stockpilot-api
                port:
                  number: 8000
          - path: /
            pathType: Prefix
            backend:
              service:
                name: stockpilot-web
                port:
                  number: 8080
    - host: "192.168.50.38"
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
