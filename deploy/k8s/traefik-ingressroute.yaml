apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: stockpilot-ingressroute
  namespace: stockpilot
  labels:
    app.kubernetes.io/name: stockpilot
spec:
  entryPoints:
    - web
    - websecure
  routes:
    - match: PathPrefix(`/api`)
      kind: Rule
      services:
        - name: stockpilot-api
          port: 8000
    - match: PathPrefix(`/docs`)
      kind: Rule
      services:
        - name: stockpilot-api
          port: 8000
    - match: PathPrefix(`/openapi.json`)
      kind: Rule
      services:
        - name: stockpilot-api
          port: 8000
    - match: PathPrefix(`/`)
      kind: Rule
      services:
        - name: stockpilot-web
          port: 8080
