apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: stockpilot-ingressroute
  namespace: stockpilot
  labels:
    app.kubernetes.io/name: stockpilot
spec:
  entryPoints:
    - web
    - websecure
  routes:
    - match: (Host(`stockpilot.vm.ok`) || Host(`192.168.50.37`) || Host(`192.168.50.36`) || Host(`192.168.50.38`) || Host(`192.168.50.39`)) && PathPrefix(`/api`)
      kind: Rule
      services:
        - name: stockpilot-api
          port: 8000
    - match: (Host(`stockpilot.vm.ok`) || Host(`192.168.50.37`) || Host(`192.168.50.36`) || Host(`192.168.50.38`) || Host(`192.168.50.39`)) && PathPrefix(`/docs`)
      kind: Rule
      services:
        - name: stockpilot-api
          port: 8000
    - match: (Host(`stockpilot.vm.ok`) || Host(`192.168.50.37`) || Host(`192.168.50.36`) || Host(`192.168.50.38`) || Host(`192.168.50.39`)) && PathPrefix(`/openapi.json`)
      kind: Rule
      services:
        - name: stockpilot-api
          port: 8000
    - match: (Host(`stockpilot.vm.ok`) || Host(`192.168.50.37`) || Host(`192.168.50.36`) || Host(`192.168.50.38`) || Host(`192.168.50.39`)) && PathPrefix(`/`)
      kind: Rule
      services:
        - name: stockpilot-web
          port: 8080
