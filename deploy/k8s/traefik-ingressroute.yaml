apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: stockpilot-ingressroute
  namespace: stockpilot
  labels:
    app.kubernetes.io/name: stockpilot
spec:
  entryPoints:
    - web
    - websecure
  routes:
    - match: Host(`stockpilot.vm.ok`) && PathPrefix(`/`)
      kind: Rule
      services:
        - name: stockpilot-api
          port: 8000
