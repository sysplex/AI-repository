apiVersion: v1
kind: Secret
metadata:
  name: stockpilot-secret
  namespace: stockpilot
type: Opaque
stringData:
  # 必须为 >= 32 字符的安全随机密钥
  SECRET_KEY: "change-this-to-a-very-secure-random-secret-key-in-prod"
  # 数据库与 Redis 目标连接串
  DATABASE_URL: "postgresql+asyncpg://stockpilot:your_pg_password@postgres:5432/stockpilot"
  REDIS_URL: "redis://redis:6379/0"
