apiVersion: batch/v1
kind: Job
metadata:
  name: stockpilot-migrate
  namespace: stockpilot
  labels:
    app.kubernetes.io/name: stockpilot
    app.kubernetes.io/component: migrate
spec:
  ttlSecondsAfterFinished: 600
  backoffLimit: 3
  template:
    metadata:
      labels:
        app.kubernetes.io/name: stockpilot
        app.kubernetes.io/component: migrate
    spec:
      restartPolicy: OnFailure
      containers:
        - name: migrate
          image: 192.168.50.36:30088/stockpilot/stockpilot-app:v1.0.0
          command: ["alembic", "upgrade", "head"]
          envFrom:
            - configMapRef:
                name: stockpilot-config
            - secretRef:
                name: stockpilot-secret
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
