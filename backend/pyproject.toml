[project]
name = "stockpilot"
version = "0.1.0"
description = "StockPilot M0 foundation skeleton"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "pydantic>=2.8,<3",
  "pydantic-settings>=2.4,<3",
  "sqlalchemy[asyncio]>=2.0,<3",
  "asyncpg>=0.29,<1",
  "alembic>=1.13,<2",
  "structlog>=24.4,<26",
  "redis>=4.2,<7",
  "arq>=0.25,<1",
  "prometheus-client>=0.20,<1",
  "exchange-calendars>=4.5,<6",
  "httpx>=0.27,<1",
]

[dependency-groups]
dev = [
  "pytest>=8.3,<10",
  "pytest-asyncio>=0.24,<2",
  "pytest-cov>=5,<8",
  "hypothesis>=6.112,<7",
  "testcontainers[postgres]>=4.8,<5",
  "fakeredis>=2.25,<3",
  "ruff>=0.6,<1",
  "mypy>=1.11,<2",
  "import-linter>=2.0,<3",
  "pip-audit>=2.7,<3",
  "pre-commit>=3.8,<5",
]

[tool.uv]
package = false
# 任务卡「避开发布不足 14 天的版本」：只允许解析截止日之前发布的版本。
# 截止日 = T01 执行日 2026-11-11 往前 14 天。里程碑推进时由协调者更新。
exclude-newer = "2026-10-28T00:00:00Z"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["."]
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
# docs/02 §4 规则 5：外部 SDK 只能出现在各模块 adapters/ 内。
# M0 阶段尚不存在 adapters 包（见 T01 PR「假设与偏差」），故全局禁用。
"yfinance".msg = "外部 SDK 仅允许出现在 app.modules.*.adapters（docs/02 §4）"
"anthropic".msg = "外部 SDK 仅允许出现在 app.modules.*.adapters（docs/02 §4）"
"alpaca".msg = "外部 SDK 仅允许出现在 app.modules.*.adapters（docs/02 §4）"
"alpaca_trade_api".msg = "外部 SDK 仅允许出现在 app.modules.*.adapters（docs/02 §4）"

[tool.mypy]
strict = true
python_version = "3.12"
plugins = ["pydantic.mypy"]
mypy_path = "."
explicit_package_bases = true
files = ["app", "tests"]
warn_unused_ignores = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "--strict-markers -ra --cov=app --cov-report=term-missing"
markers = [
  "unit: 单元测试",
  "integration: 集成测试",
  "contract: 契约测试",
  "e2e: 端到端测试",
]
pythonpath = ["."]
testpaths = ["tests"]

[tool.coverage.run]
source = ["app"]
branch = true

[tool.coverage.report]
# T01 覆盖率豁免 E1（M0 README 附录 A）：T10 合并后调整为 80。
fail_under = 0
show_missing = true

[tool.importlinter]
root_packages = ["app"]

[[tool.importlinter.contracts]]
name = "分层契约：api → 应用服务 → 能力模块 → domain → core"
type = "layers"
layers = [
  "app.api",
  "app.modules.research : app.modules.screener : app.modules.scheduler",
  "app.modules.identity : app.modules.marketdata : app.modules.strategy : app.modules.simbroker : app.modules.ai : app.modules.notify",
  "app.domain",
  "app.core",
]

[[tool.importlinter.contracts]]
name = "独立契约：marketdata / ai / identity 互不依赖"
type = "independence"
modules = [
  "app.modules.marketdata",
  "app.modules.ai",
  "app.modules.identity",
]

[[tool.importlinter.contracts]]
name = "独立契约（续）：marketdata / ai / identity 不依赖其他业务模块"
type = "forbidden"
source_modules = [
  "app.modules.marketdata",
  "app.modules.ai",
  "app.modules.identity",
]
forbidden_modules = [
  "app.modules.research",
  "app.modules.screener",
  "app.modules.scheduler",
  "app.modules.strategy",
  "app.modules.simbroker",
  "app.modules.notify",
]

[[tool.importlinter.contracts]]
name = "禁止契约：模块只能引用对方的 service / schemas 公开面"
type = "forbidden"
source_modules = [
  "app.modules.research",
  "app.modules.screener",
  "app.modules.scheduler",
  "app.modules.strategy",
  "app.modules.simbroker",
  "app.modules.notify",
  "app.api",
  "app.domain",
]
forbidden_modules = [
  "app.modules.identity",
  "app.modules.marketdata",
  "app.modules.ai",
]
