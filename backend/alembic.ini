[alembic]
script_location = alembic
prepend_sys_path = .
path_separator = os
timezone = UTC
; sqlalchemy.url is intentionally NOT set here: alembic/env.py injects it from
; Settings.database_url so that no connection string (or password) is on disk.
; See CONTRACTS.md section 5 and the T04 acceptance criteria.

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
