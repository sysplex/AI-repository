name: ci

# 触发：所有 PR + 推送到 main。作业划分见 docs/ci.md。
on:
  pull_request:
  push:
    branches: [main]

# 同分支/同 PR 的新提交取消旧运行，避免排队浪费额度。
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# 最小权限：CI 只读仓库内容，不写 PR/issue、不推镜像。
permissions:
  contents: read

env:
  UV_VERSION: "0.13.7"
  PYTHON_VERSION: "3.12"

jobs:
  lint:
    name: lint (ruff)
    runs-on: ubuntu-latest
    outputs:
      # 供 docker 作业的 job 级守卫使用：hashFiles 不能出现在 jobs.<job_id>.if。
      dockerfile_present: ${{ steps.dockerfile.outputs.present }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Detect deploy/Dockerfile (guard input)
        id: dockerfile
        # hashFiles 只允许在 step 级键中使用；文件不存在时本 step 跳过，输出为空串。
        if: hashFiles('deploy/Dockerfile') != ''
        run: echo "present=true" >> "$GITHUB_OUTPUT"
      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - name: Sync dependencies
        working-directory: backend
        run: uv sync --frozen
      - name: ruff check
        working-directory: backend
        run: uv run --frozen ruff check .
      - name: ruff format --check
        working-directory: backend
        run: uv run --frozen ruff format --check .

  typecheck:
    name: typecheck (mypy --strict)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - name: Sync dependencies
        working-directory: backend
        run: uv sync --frozen
      - name: mypy --strict
        working-directory: backend
        run: uv run --frozen mypy --strict app tests

  architecture:
    name: architecture (import-linter)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - name: Sync dependencies
        working-directory: backend
        run: uv sync --frozen
      - name: import-linter
        working-directory: backend
        run: uv run --frozen lint-imports

  test:
    name: test (pytest + postgres + redis)
    runs-on: ubuntu-latest
    services:
      # trust 认证 + 无口令连接串：CI 里不出现任何看起来像凭据的字符串。
      postgres:
        image: postgres:16
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: ci
          TZ: UTC
          PGTZ: UTC
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      APP_ENV: ci
      DATABASE_URL: postgresql+asyncpg://postgres@localhost:5432/ci
      TEST_DATABASE_URL: postgresql+asyncpg://postgres@localhost:5432/ci
      REDIS_URL: redis://localhost:6379/0
      # 仅 CI 占位值，>=32 字符以满足 Settings 校验；不是任何环境的真实密钥。
      SECRET_KEY: ci-only-placeholder-secret-not-a-real-credential
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - name: Sync dependencies
        working-directory: backend
        run: uv sync --frozen
      - name: Show connected services
        working-directory: backend
        run: |
          uv run --frozen python - <<'PY'
          import asyncio

          from app.core.db import check_db
          from app.core.redis import check_redis

          print("postgres reachable:", asyncio.run(check_db()))
          print("redis reachable:", asyncio.run(check_redis()))
          PY
      - name: pytest with coverage
        working-directory: backend
        # --cov / --cov-report=term-missing 在 pyproject 的 addopts 里，这里只补 XML 报告。
        run: uv run --frozen pytest -q --cov-report=xml
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-report
          path: |
            backend/coverage.xml
            backend/.coverage
          if-no-files-found: warn
          retention-days: 7

  security:
    name: security (pip-audit + gitleaks)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (full history for gitleaks)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - name: Sync dependencies
        working-directory: backend
        run: uv sync --frozen
      - name: pip-audit (locked dependencies)
        working-directory: backend
        run: uv run --frozen pip-audit --progress-spinner off
      # gitleaks 官方 Action 对私有仓库需要 license，这里直接用 CLI 二进制（版本固定）。
      - name: gitleaks (full git history)
        run: |
          set -euo pipefail
          GITLEAKS_VERSION=8.24.0
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz -C /tmp gitleaks
          /tmp/gitleaks version
          /tmp/gitleaks detect --source . --log-opts="--all" --redact --verbose

  docker:
    name: docker build
    needs: lint
    # hashFiles 不能用于 job 级 if（该位置只允许 github/needs/vars/inputs 与状态函数）。
    # 等价守卫：lint 的 step 级 hashFiles 检测写成 output，这里用 needs 在 job 级判断。
    # deploy/Dockerfile 不存在（T08 未合并）→ 本作业 skipped；存在 → 实跑构建与冒烟。
    if: ${{ needs.lint.outputs.dockerfile_present == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build image (no push)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: deploy/Dockerfile
          push: false
          load: true
          tags: stockpilot-ci:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test image
        run: |
          set -euo pipefail
          docker run --rm stockpilot-ci:ci id
          docker run --rm stockpilot-ci:ci ls -a /app
          # 镜像必须非 root 且不含 .env / .git / tests
          test "$(docker run --rm stockpilot-ci:ci id -u)" = "10001"
          ! docker run --rm stockpilot-ci:ci test -e /app/.env
          ! docker run --rm stockpilot-ci:ci test -e /app/.git
          ! docker run --rm stockpilot-ci:ci test -e /app/tests

  docs:
    name: docs (markdown links)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check relative links in docs/ and README
        run: |
          python3 - <<'PY'
          import re
          import sys
          from pathlib import Path

          LINK = re.compile(r"(?<!!)\[[^\]]*\]\(([^)]+)\)")
          FENCE = re.compile(r"```.*?```", re.S)

          files = [Path("README.md")] + sorted(Path("docs").rglob("*.md"))
          broken: list[str] = []
          checked = 0
          external = 0

          for path in files:
              if not path.is_file():
                  continue
              text = FENCE.sub("", path.read_text(encoding="utf-8"))
              for raw in LINK.findall(text):
                  target = raw.split("#", 1)[0].strip()
                  if not target:
                      continue
                  if target.startswith(("http://", "https://", "mailto:")):
                      external += 1
                      continue
                  if target.startswith("<") and target.endswith(">"):
                      target = target[1:-1]
                  checked += 1
                  if not (path.parent / target).resolve().exists():
                      broken.append(f"{path}: {target}")

          print(f"files={len(files)} relative_links={checked} external_links={external}")
          if broken:
              print("broken relative links:")
              for item in broken:
                  print("  -", item)
              sys.exit(1)
          print("all relative links resolve")
          PY
      # 外链不做阻断：GitHub/供应商站点偶发 403/429 会污染流水线，仅提示。
      - name: Probe external links (non-blocking)
        continue-on-error: true
        run: |
          python3 - <<'PY'
          import re
          import urllib.error
          import urllib.request
          from pathlib import Path

          LINK = re.compile(r"(?<!!)\[[^\]]*\]\((https?://[^)\s]+)\)")
          urls: list[str] = []
          for path in [Path("README.md"), *sorted(Path("docs").rglob("*.md"))]:
              if path.is_file():
                  urls.extend(LINK.findall(path.read_text(encoding="utf-8")))
          unique = sorted(set(urls))[:30]
          print(f"probing {len(unique)} of {len(set(urls))} external links")
          bad = 0
          for url in unique:
              req = urllib.request.Request(url, method="HEAD", headers={"User-Agent": "m0-link-check"})
              try:
                  with urllib.request.urlopen(req, timeout=5) as resp:
                      status = resp.status
              except urllib.error.HTTPError as exc:
                  status = exc.code
              except Exception as exc:  # noqa: BLE001 - 仅日志
                  status = type(exc).__name__
              if status != 200:
                  bad += 1
                  print(f"  {status} {url}")
          print(f"non-200 responses: {bad} (non-blocking)")
          PY
