# 一次性验收探针（M1-T07）。**不进入 main**：验证完成后随分支删除。
# 本机无 Docker，全栈「从零启动 + 迁移升降 + 演示脚本」由本工作流承载（同 M0-T11 体例）。
name: m1-probe

on:
  # 本仓库的 PAT 无 Actions: write，无法用 workflow_dispatch 触发；
  # 改为仅在本探针分支上 push 触发（该分支验证后整体删除）。
  push:
    branches: [chore/m1-t07-acceptance]
  workflow_dispatch:

permissions:
  contents: read

env:
  UV_VERSION: "0.13.7"
  PYTHON_VERSION: "3.12"
  COMPOSE: docker compose -f deploy/docker-compose.yml
  BASE: http://127.0.0.1:8080

jobs:
  full-stack:
    name: full stack (compose + migrations + demo)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: 准备 deploy/.env（示例值，仅本地/CI）
        run: cp deploy/env.example deploy/.env

      - name: docker compose up -d --build
        run: $COMPOSE up -d --build

      - name: 等待 /readyz（经 nginx）
        run: |
          code=000
          for i in $(seq 1 60); do
            code=$(curl -s -o /dev/null -w '%{http_code}' "$BASE/readyz" || true)
            echo "attempt $i -> $code"
            if [ "$code" = "200" ]; then break; fi
            sleep 3
          done
          test "$code" = "200"

      - name: 安装 uv（跑演示脚本需要 httpx）
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: uv sync --frozen
        working-directory: backend
        run: uv sync --frozen

      - name: M1 演示脚本（注册→登录→刷新→登出→改密）
        working-directory: backend
        run: |
          # 日志跟随与演示在同一 step 内启动，避免跨 step 后台进程被回收。
          nohup docker compose -f ../deploy/docker-compose.yml logs -f api > /tmp/api.log 2>&1 &
          sleep 3
          uv run --frozen python ../scripts/m1_demo.py --base-url "$BASE" --reset-log /tmp/api.log
          echo "--- 日志中的 mail.send（令牌已由脚本脱敏展示）---"
          grep -c mail.send /tmp/api.log

      - name: 迁移可升可降（downgrade base → upgrade head）
        run: |
          $COMPOSE exec -T api alembic heads
          $COMPOSE exec -T api alembic downgrade base
          $COMPOSE exec -T api alembic upgrade head
          curl -s -o /dev/null -w 'readyz after migrate: %{http_code}\n' "$BASE/readyz"
          test "$(curl -s -o /dev/null -w '%{http_code}' "$BASE/readyz")" = "200"

      - name: 接缝检查（OpenAPI ↔ docs/05 §2.1、CONTRACTS 声明名）
        working-directory: backend
        env:
          APP_ENV: ci
          DATABASE_URL: postgresql+asyncpg://postgres@db.test:5432/app
          REDIS_URL: redis://cache.test:6379/0
          SECRET_KEY: ci-only-placeholder-secret-not-a-real-credential
        run: |
          uv run --frozen python - <<'PY'
          import ast
          import pathlib
          import re

          from app.main import app

          paths = sorted(app.openapi()["paths"])
          print(f"openapi paths ({len(paths)}):")
          for path in paths:
              print("  ", path, sorted(app.openapi()["paths"][path]))

          text = pathlib.Path("../docs/05-api-spec.md").read_text(encoding="utf-8")
          rows = re.findall(r"^\|\s*(GET|POST|PATCH|DELETE)\s*\|\s*`([^`]+)`", text, re.M)
          declared = {
              "/api/v1" + raw.split("?")[0]
              for _, raw in rows
              if raw.startswith(("/auth", "/me", "/admin"))
          }
          print(f"docs/05 §2.1 identity paths ({len(declared)}):", sorted(declared))

          identity_paths = {
              p
              for p in paths
              if p.startswith("/api/v1/") and not p.startswith("/api/v1/market")
          }
          missing = declared - identity_paths
          extra = identity_paths - declared
          print("missing in openapi:", sorted(missing))
          print("undeclared in docs/05:", sorted(extra))

          contracts = pathlib.Path("../docs/tasks/M1/CONTRACTS.md").read_text(encoding="utf-8")
          names = {
              name
              for name in re.findall(r"(?:def|class)\s+([A-Za-z_][A-Za-z0-9_]*)", contracts)
              if not name.startswith("_")
          }
          found: set[str] = set()
          for file in pathlib.Path("app").rglob("*.py"):
              for node in ast.walk(ast.parse(file.read_text(encoding="utf-8"))):
                  if isinstance(node, (ast.FunctionDef, ast.AsyncFunctionDef, ast.ClassDef)):
                      found.add(node.name)
          present = names & found
          print(f"CONTRACTS names: present={len(present)} total={len(names)}")
          print("missing:", sorted(names - found))

          assert not missing, "OpenAPI 缺少 docs/05 §2.1 声明的端点"
          assert not extra, "存在未登记到 docs/05 §2.1 的 identity 端点"
          assert not (names - found), "CONTRACTS 声明的名字在代码中缺失"
          print("SEAMS OK")
          PY

      - name: 安全自检（非 root 镜像、/metrics 外部 403）
        run: |
          echo "uid: $($COMPOSE exec -T api id -u)"
          test "$($COMPOSE exec -T api id -u)" != "0"
          metrics=$(curl -s -o /dev/null -w '%{http_code}' "$BASE/metrics")
          echo "metrics from host: $metrics"
          test "$metrics" = "403"

      - name: 收尾（打印容器状态并清理）
        if: always()
        run: |
          $COMPOSE ps
          $COMPOSE logs --tail=40 api || true
          $COMPOSE down -v
