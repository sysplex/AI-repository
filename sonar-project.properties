# 1. 项目唯一标识（与您在 SonarQube 创建的 Project 保持一致）
sonar.projectKey=stockpilot-token
sonar.projectName=StockPilot

# 2. 待分析的源码目录（后端应用代码与前端应用源码）
sonar.sources=backend/app,frontend/src

# 3. 测试用例目录
sonar.tests=backend/tests

# 4. 忽略目录（杜绝扫描三方依赖、虚拟环境与编译产物，同时排除前端内联测试文件避免被重复计为业务代码）
sonar.exclusions=**/node_modules/**,**/.venv/**,**/dist/**,**/build/**,**/.mypy_cache/**,**/.ruff_cache/**,frontend/src/**/__tests__/**,frontend/src/**/*.test.ts,frontend/src/**/*.test.tsx

# 5. 联动 Python 测试覆盖率报告
sonar.python.coverage.reportPaths=backend/coverage.xml

# 6. 编码格式
sonar.sourceEncoding=UTF-8
